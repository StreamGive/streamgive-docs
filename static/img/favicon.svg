<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Favicon keeps the brand ground rather than going monochrome: a favicon
       sits on whatever colour the browser paints its tab strip, so it needs
       to carry its own background to stay legible. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a5a50"/>
      <stop offset="1" stop-color="#06403c"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#g)"/>

  <g fill="none" stroke="#2dd4a7" stroke-width="9.5" stroke-linecap="round">
    <path d="M13 19 C37 19 38 50 54 50"/>
    <path d="M13 50 L54 50"/>
    <path d="M13 81 C37 81 38 50 54 50"/>
  </g>
  <circle cx="79" cy="50" r="13.5" fill="#8ef0ce"/>
</svg>
